name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  safety:
    name: Safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install hook toolchain
        run: npm ci

      - name: Tier 1 pre-commit safety checks
        run: npm run hooks:test

      - name: Tier 2 pre-push safety checks
        run: |
          HEAD="$(git rev-parse HEAD)"
          printf 'refs/heads/ci %s refs/heads/ci %s\n' "$HEAD" "$HEAD" | bash scripts/hooks/pre-push-safety.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Hook contract tests
        run: |
          uv sync --frozen --extra full
          uv run pytest tests/test_hooks.py -q

  verify:
    name: Tests & architecture
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run pytest
        run: |
          uv sync --frozen --all-groups --extra full
          uv run pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Architecture lint
        run: |
          npm ci
          npm run lint:architecture

  mcp-image:
    name: Build MCP Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image
        run: docker build -t ed-tech-system-mcp:ci .

  deploy:
    name: Deploy MCP to Vercel
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.vercel.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Deploy to Vercel
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_out=$(mktemp)
          deploy_err=$(mktemp)
          trap 'rm -f "$deploy_out" "$deploy_err"' EXIT

          if ! vercel deploy --prod --yes --token="$VERCEL_TOKEN" >"$deploy_out" 2>"$deploy_err"; then
            cat "$deploy_err" >&2
            exit 1
          fi

          url=$(grep -Eo 'https://[^[:space:]]+' "$deploy_out" | tail -n 1 || true)
          if [ -z "$url" ]; then
            url=$(tail -n 1 "$deploy_out" | tr -d '[:space:]')
          fi
          if [ -z "$url" ]; then
            echo "Could not parse deployment URL from Vercel CLI output" >&2
            cat "$deploy_out" >&2
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
