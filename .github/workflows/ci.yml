name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  safety:
    name: Safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Install npm hook toolchain
        uses: ./.github/actions/ci-deps
        with:
          group: npm-root

      - name: Tier 1 pre-commit safety checks
        run: npm run hooks:test

      - name: Tier 2 pre-push safety checks
        run: |
          HEAD="$(git rev-parse HEAD)"
          printf 'refs/heads/ci %s refs/heads/ci %s\n' "$HEAD" "$HEAD" | bash scripts/hooks/pre-push-safety.sh

      - name: Install Python hook dependencies
        uses: ./.github/actions/ci-deps
        with:
          group: python-hooks

      - name: Hook contract tests
        run: uv run pytest tests/test_hooks.py -q

  verify:
    name: Tests & architecture
    needs: safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python test dependencies
        uses: ./.github/actions/ci-deps
        with:
          group: python-dev

      - name: Run pytest
        run: uv run pytest -q -m "not cursor_harness" --cov=src/mcp_server --cov-report=json:coverage.json --junitxml=pytest-results.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            pytest-results.xml

      - name: Install npm lint dependencies
        uses: ./.github/actions/ci-deps
        with:
          group: npm-root

      - name: Architecture lint
        run: npm run lint:architecture

  mcp-image:
    name: Build MCP Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute Docker cache key
        id: docker_cache
        shell: bash
        run: |
          key="$(bash scripts/ci/dependency-cache.sh cache-key docker-mcp)"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Build MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ed-tech-system-mcp:ci
          load: true
          cache-from: type=gha,scope=${{ steps.docker_cache.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ steps.docker_cache.outputs.key }}

  deploy:
    name: Deploy MCP to Render
    needs: [safety, verify, mcp-image]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.safety.result != 'cancelled' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ steps.render.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage artifact
        if: needs.verify.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Install Python status dependencies
        uses: ./.github/actions/ci-deps
        with:
          group: python-hooks

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Update status logs and manifest
        if: always()
        env:
          SAFETY_RESULT: ${{ needs.safety.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MCP_IMAGE_RESULT: ${{ needs.mcp-image.result }}
        run: |
          eval "$(uv run python scripts/status/pytest_summary.py pytest-results.xml)"
          bash scripts/status/ci_status.sh

      - name: Commit status history
        if: always()
        run: |
          if git diff --quiet status-logs public/status/manifest.json; then
            echo "No status changes to commit"
            exit 0
          fi
          git add status-logs public/status/manifest.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(status): update incident logs and manifest [skip ci]" || true
          if ! git push; then
            echo "::warning::Could not push status history (branch protection may require a PAT). Deploy continues with in-job manifest."
          fi

      - name: Sync secrets and trigger Render deploy
        if: needs.verify.result == 'success'
        id: render
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_GITHUB_CI_TOKEN: ${{ secrets.DOPPLER_GITHUB_CI_TOKEN }}
          DOPPLER_PROJECT: ed-harness-system
        run: bash scripts/ci/render-deploy.sh

      - name: Post-deploy health probe
        if: needs.verify.result == 'success' && steps.render.outputs.url != ''
        env:
          DEPLOY_URL: ${{ steps.render.outputs.url }}
        run: |
          if ! curl -fsS --max-time 20 "${DEPLOY_URL%/}/health" >/dev/null; then
            uv run python scripts/status/record_incident.py incident availabilityLoss \
              --summary "Production /health probe failed after deploy."
          fi
          uv run python scripts/status/prune_logs.py
          uv run python scripts/status/build_manifest.py
          git add status-logs public/status/manifest.json || true
          if ! git diff --staged --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(status): post-deploy probe update [skip ci]" || true
            git push || true
          fi
