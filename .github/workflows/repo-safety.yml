name: Repo safety

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install hook toolchain
        run: npm ci

      - name: Tier 1 pre-commit safety checks
        run: npm run hooks:test

      - name: Tier 2 pre-push safety checks
        run: |
          HEAD="$(git rev-parse HEAD)"
          printf 'refs/heads/ci %s refs/heads/ci %s\n' "$HEAD" "$HEAD" | bash scripts/hooks/pre-push-safety.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Hook contract tests
        run: |
          uv sync --frozen
          uv run pytest tests/test_hooks.py -q
