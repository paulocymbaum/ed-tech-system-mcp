[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server"
version = "0.1.0"
description = "Domain-Driven MCP server for ed-tech workflows"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==3.4.4",
    "langchain",
    "langgraph",
    "pydantic>=2",
    "supabase",
    "duckduckgo-search",
    "google-api-python-client",
    "python-dotenv",
    "pydantic-settings",
]

[project.scripts]
mcp-server = "mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcp_server"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
