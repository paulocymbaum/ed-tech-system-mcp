[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server"
version = "0.1.0"
description = "Domain-Driven MCP server for ed-tech workflows"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==3.4.4",
    "langchain",
    "langgraph",
    "pydantic>=2",
    "supabase",
    "duckduckgo-search",
    "google-api-python-client",
    "python-dotenv",
    "pydantic-settings",
    "redis",
    "langchain-groq>=1.1.3",
]

[project.scripts]
mcp-server = "mcp_server.main:main"
workflow-ui = "mcp_server.local_ui_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "import-linter",
]

[tool.importlinter]
root_package = "mcp_server"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-isolation"
name = "Domain must not depend on outer layers or frameworks"
type = "forbidden"
source_modules = ["mcp_server.domain"]
forbidden_modules = [
    "mcp_server.application",
    "mcp_server.interface",
    "mcp_server.infrastructure",
    "mcp_server.settings",
    "mcp_server.wiring",
    "mcp_server.main",
    "langchain",
    "langgraph",
    "fastmcp",
    "supabase",
    "googleapiclient",
    "duckduckgo_search",
]

[[tool.importlinter.contracts]]
id = "application-no-infra"
name = "Application must not import infrastructure"
type = "forbidden"
source_modules = ["mcp_server.application"]
forbidden_modules = ["mcp_server.infrastructure"]

[[tool.importlinter.contracts]]
id = "interface-no-infra"
name = "Interface must not import infrastructure"
type = "forbidden"
source_modules = ["mcp_server.interface"]
forbidden_modules = ["mcp_server.infrastructure"]
allow_indirect_imports = false
ignore_imports = [
    "mcp_server.interface.local_ui.api -> mcp_server.main",
]

[[tool.importlinter.contracts]]
id = "infra-no-upper-layers"
name = "Infrastructure may only reach domain"
type = "forbidden"
source_modules = ["mcp_server.infrastructure"]
forbidden_modules = [
    "mcp_server.application",
    "mcp_server.interface",
]

[[tool.importlinter.contracts]]
id = "inner-no-settings"
name = "Inner layers must not import settings"
type = "forbidden"
source_modules = [
    "mcp_server.domain",
    "mcp_server.application",
    "mcp_server.interface",
]
forbidden_modules = ["mcp_server.settings"]
allow_indirect_imports = false
ignore_imports = [
    "mcp_server.interface.local_ui.api -> mcp_server.main",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcp_server"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
