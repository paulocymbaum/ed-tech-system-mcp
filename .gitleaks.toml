title = "ed-tech-system-mcp gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlisted paths and patterns"
paths = [
  '''\.env\.example$''',
  '''ENVIRONMENT_SETUP\.md$''',
  '''ARCHITECTURE\.md$''',
  '''package-lock\.json$''',
  '''tests/test_hooks\.py$''',
  '''scripts/hooks/''',
]
regexes = [
  '''SUPABASE_URL=\s*$''',
  '''SUPABASE_SERVICE_ROLE_KEY=\s*$''',
  '''YOUTUBE_API_KEY=\s*$''',
  '''GROQ_API_KEY=\s*$''',
  '''\$\{\{ secrets\.[A-Z0-9_]+ \}\}''',
  '''\$\{env:[A-Z0-9_]+\}''',
]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[a-zA-Z0-9]{20,}'''

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
